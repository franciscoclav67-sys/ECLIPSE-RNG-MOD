name: Build ECLIPSE RNG

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source ZIP
        run: |
          rm -rf extracted
          unzip -o ECLIPSE_RNG_MOD_V1_SOURCE.zip -d extracted
          test -f extracted/eclipse_mod_v1/build.gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build mod
        working-directory: extracted/eclipse_mod_v1
        run: gradle build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-rng-mod-v1
          path: extracted/eclipse_mod_v1/build/libs/*.jar
          if-no-files-found: error
